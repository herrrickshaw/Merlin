[project]
name = "merlin-screener-scripts"
version = "0.0.0"
description = "Python screening/backtest scripts alongside the Merlin OCaml tool"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
