[project]
name = "merlin-screener-scripts"
version = "0.0.0"
description = "Python screening/backtest scripts alongside the Merlin OCaml tool"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# Data tables with long literal rows
"nbim_criteria_analysis.py" = ["E501"]
"screening_strategy_data.py" = ["E501"]
"forward_picks_data.py" = ["E501"]
